name: Setup Python and uv
description: Configure Python environment with uv

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.15.1"
  sync-project:
    description: Whether to install the repository environment with uv sync
    required: false
    default: "true"
  uv-version:
    description: uv version to install
    required: false
    default: "0.13.5"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        version: ${{ inputs.uv-version }}

    - name: Sync repository environment
      if: ${{ inputs.sync-project == 'true' }}
      shell: bash
      run: uv sync --locked

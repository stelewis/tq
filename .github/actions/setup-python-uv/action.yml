name: Setup Python and uv
description: Configure Python environment with uv

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14.7"
  sync-project:
    description: Whether to install the repository environment with uv sync
    required: false
    default: "true"
  uv-version:
    description: uv version to install
    required: false
    default: "0.12.4"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        version: ${{ inputs.uv-version }}

    - name: Sync repository environment
      if: ${{ inputs.sync-project == 'true' }}
      shell: bash
      run: uv sync --locked

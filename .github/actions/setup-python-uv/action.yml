name: Setup Python and uv
description: Configure Python environment with uv

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.14"
  sync-project:
    description: Whether to install the repository environment with uv sync
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      with:
        enable-cache: true

    - name: Install dependencies
      if: ${{ inputs.sync-project == 'true' }}
      shell: bash
      run: uv sync --locked

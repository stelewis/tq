name: Setup Rust maintenance tools
description: Install pinned Rust maintenance CLIs used by repository workflows

inputs:
  install-stable-toolchain:
    description: Install the stable Rust toolchain for tools that are bootstrapped outside the product MSRV
    required: false
    default: "false"
  install-cargo-audit:
    description: Install cargo-audit from the pinned crates.io release
    required: false
    default: "false"
  cargo-audit-version:
    description: cargo-audit release to install with the stable toolchain
    required: false
    default: "0.22.2"
  install-cargo-deny:
    description: Install cargo-deny from the pinned stable release
    required: false
    default: "false"
  cargo-deny-version:
    description: cargo-deny release to install with the stable toolchain
    required: false
    default: "0.20.2"

runs:
  using: composite
  steps:
    - name: Install stable Rust toolchain
      if: ${{ inputs.install-stable-toolchain == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        rustup toolchain install stable --profile minimal

    - name: Determine maintenance tool cache key
      if: ${{ inputs.install-cargo-audit == 'true' || inputs.install-cargo-deny == 'true' }}
      id: toolchain
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${{ inputs.install-stable-toolchain }}" == "true" ]]; then
          release="$(rustc +stable -Vv | sed -n 's/^release: //p' | head -n 1)"
          if [[ -z "$release" ]]; then
            echo "Could not determine the stable Rust release"
            exit 1
          fi

          echo "cache-suffix=stable-${release}" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        release="$(rustc -Vv | sed -n 's/^release: //p' | head -n 1)"
        if [[ -z "$release" ]]; then
          echo "Could not determine the active Rust release"
          exit 1
        fi

        echo "cache-suffix=active-${release}" >> "$GITHUB_OUTPUT"

    - name: Compose maintenance tool cache keys
      if: ${{ inputs.install-cargo-audit == 'true' || inputs.install-cargo-deny == 'true' }}
      id: cache-key
      shell: bash
      run: |
        set -euo pipefail

        cache_key_prefix="rust-maintenance-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cache-suffix }}-audit-${{ inputs.install-cargo-audit }}-${{ inputs.cargo-audit-version }}-deny-${{ inputs.install-cargo-deny }}-${{ inputs.cargo-deny-version }}"

        echo "exact=${cache_key_prefix}-${{ hashFiles('.github/actions/setup-rust-maintenance-tools/action.yml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore cached maintenance tool binaries
      if: ${{ inputs.install-cargo-audit == 'true' || inputs.install-cargo-deny == 'true' }}
      id: maintenance-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo-maintenance-tools
        key: ${{ steps.cache-key.outputs.exact }}

    - name: Add maintenance tools to PATH
      if: ${{ inputs.install-cargo-audit == 'true' || inputs.install-cargo-deny == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        echo "$HOME/.cargo-maintenance-tools/bin" >> "$GITHUB_PATH"

    - name: Install cargo-audit
      if: ${{ inputs.install-cargo-audit == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        tool_root="$HOME/.cargo-maintenance-tools"
        if [[ -x "$tool_root/bin/cargo-audit" ]]; then
          actual_version="$("$tool_root/bin/cargo-audit" audit --version | awk '{print $NF}')"
          if [[ "$actual_version" == "${{ inputs.cargo-audit-version }}" ]]; then
            exit 0
          fi
          rm "$tool_root/bin/cargo-audit"
        fi

        cargo +stable install --root "$tool_root" --locked "cargo-audit@${{ inputs.cargo-audit-version }}"

    - name: Install cargo-deny
      if: ${{ inputs.install-cargo-deny == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        tool_root="$HOME/.cargo-maintenance-tools"
        if [[ -x "$tool_root/bin/cargo-deny" ]]; then
          actual_version="$("$tool_root/bin/cargo-deny" deny --version | awk '{print $NF}')"
          if [[ "$actual_version" == "${{ inputs.cargo-deny-version }}" ]]; then
            exit 0
          fi
          rm "$tool_root/bin/cargo-deny"
        fi

        cargo +stable install --root "$tool_root" --locked "cargo-deny@${{ inputs.cargo-deny-version }}"

    - name: Save maintenance tool cache
      if: ${{ (inputs.install-cargo-audit == 'true' || inputs.install-cargo-deny == 'true') && steps.maintenance-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo-maintenance-tools
        key: ${{ steps.cache-key.outputs.exact }}

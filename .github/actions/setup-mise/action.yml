name: Setup mise toolchain
description: Install the manifest-pinned mise toolchain from the repository lock

inputs:
  mise-version:
    description: Exact mise version to install
    required: false
    default: "2026.7.5"

runs:
  using: composite
  steps:
    - name: Set up mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      with:
        version: ${{ inputs.mise-version }}

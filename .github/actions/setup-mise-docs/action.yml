name: Setup mise docs toolchain
description: Configure mise and install docs dependencies

inputs:
  install-dependencies:
    description: Install docs npm dependencies after setting up mise
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup mise toolchain
      uses: ./.github/actions/setup-mise

    - name: Install docs dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      run: mise exec -- npm ci --ignore-scripts

name: Frozen Pre-commit Policy

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  enforce-frozen-pre-commit:
    name: Enforce frozen pre-commit SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Validate external pre-commit hook refs are SHA pinned
        run: cargo dev policy verify-pre-commit-pins --repo-root .

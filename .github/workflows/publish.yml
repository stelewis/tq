name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release candidate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_head_sha: ${{ steps.release.outputs.source_head_sha }}
      source_run_id: ${{ steps.release.outputs.source_run_id }}
    steps:
      - name: Require immutable tag ruleset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          protected=false
          while read -r ruleset_id; do
            ruleset="$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id")"
            if jq -e '
              .target == "tag" and
              .enforcement == "active" and
              (.bypass_actors | length) == 0 and
              (.conditions.ref_name.include | index("~ALL")) != null and
              ([.rules[].type] | index("update")) != null and
              ([.rules[].type] | index("deletion")) != null
            ' <<<"$ruleset" >/dev/null; then
              protected=true
              break
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/rulesets?targets=tag" \
              --jq '.[] | .id'
          )

          if [ "$protected" != true ]; then
            echo "An active no-bypass ruleset must block updates and deletions for all tags"
            exit 1
          fi

      - name: Resolve SemVer tag for successful CI run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          head_sha='${{ github.event.workflow_run.head_sha }}'

          mapfile -t release_tags < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
              --jq '.[] | select(.commit.sha == "'"$head_sha"'" and (.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .name'
          )

          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No SemVer tag points at $head_sha; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${#release_tags[@]}" -gt 1 ]; then
            printf 'Multiple SemVer tags point at %s: %s\n' "$head_sha" "${release_tags[*]}"
            exit 1
          fi

          release_tag="${release_tags[0]}"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release '$release_tag' already exists; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_publish=true"
            echo "release_tag=$release_tag"
            echo "source_head_sha=$head_sha"
            echo "source_run_id=${{ github.event.workflow_run.id }}"
          } >> "$GITHUB_OUTPUT"

      - name: Require validated release artifact
        if: ${{ steps.release.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id='${{ github.event.workflow_run.id }}'
          artifact_count="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '[.artifacts[] | select(.name == "validated-dist" and .expired == false)] | length'
          )"

          if [ "$artifact_count" -ne 1 ]; then
            echo "Expected exactly one validated-dist artifact for tagged CI run $run_id, found $artifact_count"
            exit 1
          fi

  verify:
    name: Verify validated artifacts
    needs: prepare
    if: ${{ needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - name: Reset transient directories
        run: rm -rf dist "$RUNNER_TEMP/release-smoke"

      - name: Download validated distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-dist
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Verify CI artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --deny-self-hosted-runners
          done

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.4"

      - name: Validate package metadata
        run: uv run --isolated --no-project --with twine -- twine check dist/*

      - name: Smoke check Linux wheel and sdist entrypoints
        shell: bash
        run: |
          set -euo pipefail

          wheel_path="$(find "$PWD/dist" -maxdepth 1 -type f \( -name '*manylinux*.whl' -o -name '*musllinux*.whl' \) | head -n 1)"
          if [ -z "$wheel_path" ]; then
            echo "No Linux wheel artifact found in dist/"
            exit 1
          fi
          sdist_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          if [ -z "$sdist_path" ]; then
            echo "No source distribution artifact found in dist/"
            exit 1
          fi
          uv run --isolated --no-project --with "$wheel_path" -- tq --help
          uv run --isolated --no-project --with "$wheel_path" -- tq check --help
          uv run --isolated --no-project --with "$sdist_path" -- tq --help
          uv run --isolated --no-project --with "$sdist_path" -- tq check --help

      - name: Smoke check fixture from Linux wheel
        shell: bash
        run: |
          set -euo pipefail

          wheel_path="$(find "$PWD/dist" -maxdepth 1 -type f \( -name '*manylinux*.whl' -o -name '*musllinux*.whl' \) | head -n 1)"
          if [ -z "$wheel_path" ]; then
            echo "No Linux wheel artifact found in dist/"
            exit 1
          fi
          smoke_root="$RUNNER_TEMP/release-smoke"
          mkdir -p "$smoke_root/src/demo" "$smoke_root/tests/demo"
          cat > "$smoke_root/pyproject.toml" <<'TOML'
          [project]
          name = "demo"
          version = "0.0.0"
          requires-python = ">=3.11"

          [tool.tq]
          init_modules = "ignore"
          max_test_file_non_blank_lines = 600
          qualifier_strategy = "allowlist"
          allowed_qualifiers = ["regression"]

          [[tool.tq.targets]]
          name = "demo"
          package = "demo"
          source_root = "src"
          test_root = "tests"
          TOML
          cat > "$smoke_root/src/demo/core.py" <<'PY'
          def add(a: int, b: int) -> int:
              return a + b
          PY
          cat > "$smoke_root/tests/demo/test_core.py" <<'PY'
          from demo.core import add


          def test_add() -> None:
              assert add(1, 1) == 2
          PY
          (
            cd "$smoke_root"
            uv run --isolated --no-project --with "$wheel_path" -- tq check
          )

  publish:
    name: Publish validated artifacts
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ vars.PYPI_ENVIRONMENT || 'pypi' }}
    concurrency:
      group: publish-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
    steps:
      - name: Reset artifact directory
        run: rm -rf dist

      - name: Download validated distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-dist
          path: dist
          repository: ${{ github.repository }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Reverify CI artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for artifact in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --deny-self-hosted-runners
          done

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.4"

      - name: Require release tag to remain bound to validated revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_HEAD_SHA: ${{ needs.prepare.outputs.source_head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )
          while [ "$object_type" = "tag" ]; do
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha'
            )
          done

          if [ "$object_type" != "commit" ] || [ "$object_sha" != "$SOURCE_HEAD_SHA" ]; then
            echo "Release tag '$RELEASE_TAG' no longer resolves to validated commit '$SOURCE_HEAD_SHA'"
            exit 1
          fi

      - name: Publish
        run: uv publish dist/*.whl dist/*.tar.gz

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail

          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS

      - name: Recheck release tag binding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE_HEAD_SHA: ${{ needs.prepare.outputs.source_head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          read -r object_type object_sha < <(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )
          while [ "$object_type" = "tag" ]; do
            read -r object_type object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" \
                --jq '.object.type + " " + .object.sha'
            )
          done

          if [ "$object_type" != "commit" ] || [ "$object_sha" != "$SOURCE_HEAD_SHA" ]; then
            echo "Release tag '$RELEASE_TAG' no longer resolves to validated commit '$SOURCE_HEAD_SHA'"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME='${{ needs.prepare.outputs.release_tag }}'

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$TAG_NAME' already exists"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG_NAME" \
            --generate-notes

  post-publish:
    name: Verify published release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Setup uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          version: "0.12.4"

      - name: Post-publish smoke
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            if uvx --from "tqlint==$RELEASE_TAG" tq --help; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "tqlint==$RELEASE_TAG is not visible via uvx after retries"
              exit 1
            fi
            sleep 20
          done

      - name: Consumer provenance check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          verify_root="$RUNNER_TEMP/pypi-verify"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"

          for attempt in 1 2 3 4 5; do
            rm -f "$verify_root"/*

            if python -m pip download --no-deps --only-binary=:all: "tqlint==$RELEASE_TAG" -d "$verify_root"; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Could not download wheel for tqlint==$RELEASE_TAG from PyPI after retries"
              exit 1
            fi

            sleep 20
          done

          wheel_path="$(find "$verify_root" -maxdepth 1 -type f -name "tqlint-${RELEASE_TAG}-*.whl" | head -n 1)"
          if [ -z "$wheel_path" ]; then
            echo "No wheel found for tqlint==$RELEASE_TAG"
            exit 1
          fi

          wheel_name="$(basename "$wheel_path")"
          if [[ "$wheel_name" != *manylinux* && "$wheel_name" != *musllinux* ]]; then
            echo "Expected a Linux wheel from PyPI download, found '$wheel_name'"
            exit 1
          fi

          gh attestation verify "$wheel_path" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --deny-self-hosted-runners

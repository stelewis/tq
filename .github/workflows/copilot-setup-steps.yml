name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/**
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - rust-toolchain.toml
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/**
      - Cargo.toml
      - Cargo.lock
      - crates/**/Cargo.toml
      - rust-toolchain.toml
      - pyproject.toml
      - uv.lock
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Setup docs toolchain
        uses: ./.github/actions/setup-docs

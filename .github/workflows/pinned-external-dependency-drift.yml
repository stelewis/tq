name: Pinned External Dependency Drift

on:
  schedule:
    - cron: "15 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-pins:
    name: Review pinned action and pre-commit refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      title: ${{ steps.drift.outputs.title }}
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      issue_body: ${{ steps.drift.outputs.issue_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Verify centralized developer tool pins
        run: cargo dev policy verify-pins --repo-root .

      - name: Check upstream drift for pinned action and pre-commit refs
        id: drift
        shell: bash
        run: |
          set -euo pipefail

          report_file="$(mktemp)"
          issue_body_file="$(mktemp)"

          set +e
          cargo dev policy audit-external-pins --output json --repo-root . > "$report_file"
          status="$?"
          set -e

          python <<'PY' "$report_file" "$issue_body_file" "$status" >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          report_path, issue_body_path, status = sys.argv[1:]
          report = json.loads(open(report_path, encoding="utf-8").read())

          lines = [
              f"## {report['title']}",
              "",
              "| Surface | Source | Dependency | Pinned | Latest | Status |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for result in report["results"]:
              lines.append(
                  "| {surface} | {source} | {name} | {pinned} | {latest} | {status} |".format(
                      surface=result["surface"],
                      source=result["source"],
                      name=result["name"],
                      pinned=result.get("pinned") or "unavailable",
                      latest=result.get("latest") or "unavailable",
                      status=result["status"],
                  )
              )
          lines.extend([
              "",
              "One or more frozen external pins need review."
              if report["drift_detected"]
              else "All frozen external pins are current.",
          ])
          body = "\n".join(lines) + "\n"
          issue_body = (
              body
              + f"\nDetected by workflow run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          )

          open(issue_body_path, "w", encoding="utf-8").write(issue_body)
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write(body)

          if status != "0" and not report["drift_detected"]:
              raise SystemExit(f"external pin audit failed without drift: exit {status}")

          print("title=chore: review frozen external pins")
          print(f"drift_detected={str(report['drift_detected']).lower()}")
          print("issue_body<<__ISSUE_BODY__")
          print(issue_body, end="")
          print("__ISSUE_BODY__")
          PY

  sync-drift-issue:
    name: Sync pin drift issue
    if: ${{ github.event_name == 'schedule' }}
    needs: audit-pins
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Sync pin drift issue
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ needs.audit-pins.outputs.title }}
          ISSUE_BODY: ${{ needs.audit-pins.outputs.issue_body }}
          DRIFT_DETECTED: ${{ needs.audit-pins.outputs.drift_detected }}
        run: |
          set -euo pipefail

          existing_issue_number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --search "$ISSUE_TITLE in:title" --json number,title --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -n 1)"

          if [[ "$DRIFT_DETECTED" == 'true' ]]; then
            issue_body_file="$(mktemp)"
            printf '%s' "$ISSUE_BODY" > "$issue_body_file"

            if [[ -n "$existing_issue_number" ]]; then
              gh issue edit "$existing_issue_number" --repo "$GH_REPO" --body-file "$issue_body_file"
              exit 0
            fi

            gh issue create --repo "$GH_REPO" --title "$ISSUE_TITLE" --body-file "$issue_body_file"
            exit 0
          fi

          if [[ -z "$existing_issue_number" ]]; then
            exit 0
          fi

          gh issue comment "$existing_issue_number" --repo "$GH_REPO" --body "Frozen action and pre-commit pins are current again. Closing this tracking issue."
          gh issue close "$existing_issue_number" --repo "$GH_REPO"

  fail-on-drift:
    name: Fail on drift
    if: ${{ needs.audit-pins.outputs.drift_detected == 'true' }}
    needs: audit-pins
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail on drift
        shell: bash
        run: |
          echo "Frozen action or pre-commit pins are stale. Review the workflow summary for details."
          exit 1

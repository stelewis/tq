name: Pinned External Dependency Drift

on:
  schedule:
    - cron: "15 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-pins:
    name: Review pinned action and pre-commit refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      report: ${{ steps.drift.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Verify centralized developer tool pins
        run: cargo dev policy verify-pins --repo-root .

      - name: Check upstream drift for pinned action and pre-commit refs
        id: drift
        shell: bash
        run: |
          set -euo pipefail

          report_file="$(mktemp)"
          set +e
          cargo dev policy audit-external-pins --output agent --repo-root . > "$report_file"
          audit_exit_code="$?"
          set -e

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

          case "$audit_exit_code" in
            0) drift_detected=false ;;
            1) drift_detected=true ;;
            *)
              echo "external pin audit failed: exit $audit_exit_code"
              exit "$audit_exit_code"
              ;;
          esac

          delimiter="$(uuidgen)"
          {
            echo "drift_detected=$drift_detected"
            echo "report<<$delimiter"
            cat "$report_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  sync-drift-issue:
    name: Sync pin drift issue
    if: ${{ github.event_name == 'schedule' }}
    needs: audit-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Write drift report
        shell: bash
        env:
          REPORT: ${{ needs.audit-pins.outputs.report }}
        run: printf '%s\n' "$REPORT" > "$RUNNER_TEMP/drift-report.md"

      - name: Sync pin drift issue
        uses: ./.github/actions/sync-drift-issue
        with:
          issue-title: "chore: review frozen external pins"
          report-file: ${{ runner.temp }}/drift-report.md
          drift-detected: ${{ needs.audit-pins.outputs.drift_detected }}
          all-clear-comment: >-
            Frozen action and pre-commit pins are current again.
            Closing this tracking issue.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  fail-on-drift:
    name: Fail on drift
    if: ${{ needs.audit-pins.outputs.drift_detected == 'true' }}
    needs: audit-pins
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail on drift
        shell: bash
        run: |
          echo "Frozen action or pre-commit pins are stale. Review the workflow summary for details."
          exit 1

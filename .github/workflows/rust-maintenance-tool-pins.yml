name: Rust maintenance tool pins

on:
  schedule:
    - cron: "45 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-maintenance-tool-pins:
    name: Review pinned Rust maintenance tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      drift_detected: ${{ steps.drift.outputs.drift_detected }}
      report: ${{ steps.drift.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Check upstream drift for pinned maintenance tools
        id: drift
        shell: bash
        run: |
          set -euo pipefail

          report_file="$(mktemp)"
          set +e
          cargo dev deps audit-maintenance-tools --output agent --repo-root . > "$report_file"
          audit_exit_code="$?"
          set -e

          cat "$report_file" >> "$GITHUB_STEP_SUMMARY"

          case "$audit_exit_code" in
            0) drift_detected=false ;;
            1) drift_detected=true ;;
            *)
              echo "maintenance tool audit failed: exit $audit_exit_code"
              exit "$audit_exit_code"
              ;;
          esac

          delimiter="$(uuidgen)"
          {
            echo "drift_detected=$drift_detected"
            echo "report<<$delimiter"
            cat "$report_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  sync-maintenance-tool-pin-issue:
    name: Sync maintenance tool pin issue
    if: ${{ github.event_name == 'schedule' }}
    needs: audit-maintenance-tool-pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write drift report
        shell: bash
        env:
          REPORT: ${{ needs.audit-maintenance-tool-pins.outputs.report }}
        run: printf '%s\n' "$REPORT" > "$RUNNER_TEMP/drift-report.md"

      - name: Sync maintenance tool pin issue
        uses: ./.github/actions/sync-drift-issue
        with:
          issue-title: "chore: review Rust maintenance tool pins"
          report-file: ${{ runner.temp }}/drift-report.md
          drift-detected: ${{ needs.audit-maintenance-tool-pins.outputs.drift_detected }}
          all-clear-comment: >-
            Pinned Rust maintenance tools are current again.
            Closing this tracking issue.
          github-token: ${{ secrets.GITHUB_TOKEN }}

  fail-on-drift:
    name: Fail on drift
    if: ${{ needs.audit-maintenance-tool-pins.outputs.drift_detected == 'true' }}
    needs: audit-maintenance-tool-pins
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail on drift
        shell: bash
        run: |
          echo "Rust maintenance tool pins are stale. Review the workflow summary for details."
          exit 1

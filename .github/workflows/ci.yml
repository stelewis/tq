name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Temporary override until gitleaks-action publishes a Node24-compatible release.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages (commitizen)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Check commit messages (pull_request)
        if: ${{ github.event_name == 'pull_request' }}
        run: uv run cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Check commit messages (push)
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          git fetch --no-tags origin "$BEFORE_SHA"
          git rev-parse --verify "$BEFORE_SHA^{commit}" >/dev/null
          uv run cz check --rev-range "$BEFORE_SHA..$HEAD_SHA"

  hygiene:
    name: Hygiene (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Run hygiene hooks
        run: >-
          uv run prek run --all-files
          trailing-whitespace end-of-file-fixer check-yaml check-added-large-files

  format:
    name: Format (cargo fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cargo fmt
        run: cargo fmt --all --check

  lint:
    name: Lint (cargo clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  change-scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      rust_security: ${{ steps.scope.outputs.rust_security }}
      docs_security: ${{ steps.scope.outputs.docs_security }}
      docs_sync: ${{ steps.scope.outputs.docs_sync }}
      docs_build: ${{ steps.scope.outputs.docs_build }}
      runtime_dependency_inputs: ${{ steps.scope.outputs.runtime_dependency_inputs }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      release_relevant: ${{ steps.scope.outputs.release_relevant }}
      broad_gate: ${{ steps.scope.outputs.broad_gate }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Determine change scope
        id: scope
        run: >-
          cargo dev change-scope
          --event '${{ github.event_name }}'
          --base-ref '${{ github.event.pull_request.base.sha || github.event.before || '' }}'
          --head-ref '${{ github.event.pull_request.head.sha || github.sha || '' }}'
          >> "$GITHUB_OUTPUT"

  docs-sync:
    name: Docs sync contracts
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_sync == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Regenerate reference docs
        run: cargo run -p tq-docsgen --locked -- generate all

      - name: Ensure generated docs are committed
        run: |
          git diff --exit-code \
            README.md \
            docs/reference/cli.md \
            docs/reference/configuration.md \
            docs/guide/quickstart.md \
            docs/.vitepress/generated/rules-sidebar.ts \
            docs/reference/rules/index.md \
            docs/reference/rules/*.md

  docs-build:
    name: Docs build (VitePress)
    needs: change-scope
    if: ${{ needs.change-scope.outputs.docs_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup docs toolchain
        uses: ./.github/actions/setup-docs

      - name: Build docs
        run: npm run docs:build

  runtime-dep-check:
    name: Runtime dependency check (advisory)
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' && needs.change-scope.outputs.runtime_dependency_inputs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Check runtime dependency changes
        shell: bash
        run: |
          set -euo pipefail
          output="$(cargo dev runtime-deps \
            --repo-root . \
            --base-ref '${{ github.event.pull_request.base.sha }}' \
            --head-ref '${{ github.event.pull_request.head.sha }}')"
          echo "$output"
          printf '## Runtime dependency check\n\n%s\n' "$output" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests (cargo)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Cargo test
        run: cargo test --workspace --locked

  build:
    name: Build and source packaging checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Verify release policy
        run: cargo dev policy verify-release --repo-root .

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv
        with:
          sync-project: "false"

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Build release CLI
        run: cargo build -p tq-cli --release --locked

      - name: Build Python source distribution
        run: |
          rm -rf dist
          uv build --sdist

      - name: Verify source distribution
        run: cargo dev release verify-artifacts --dist-dir dist --profile sdist

      - name: Smoke check built source distribution entrypoints
        shell: bash
        run: |
          set -euo pipefail

          sdist_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          if [ -z "$sdist_path" ]; then
            echo "No source distribution artifact found in dist/"
            exit 1
          fi

          uv run --isolated --no-project --with "$sdist_path" -- tq --help
          uv run --isolated --no-project --with "$sdist_path" -- tq check --help

      - name: Upload tag release candidates
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tag-release-candidate-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release-wheels:
    name: Release wheel build (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runs_on: ubuntu-latest
            artifact_name: wheel-manylinux-x86_64
            artifact_profile: linux-wheel
            maturin_requirement: maturin_zig
            extra_build_args: --compatibility pypi --zig
          - label: macOS x86_64
            runs_on: macos-15-intel
            artifact_name: wheel-macos-x86_64
            artifact_profile: macos-x86-64-wheel
            maturin_requirement: maturin
            extra_build_args: ""
          - label: macOS arm64
            runs_on: macos-14
            artifact_name: wheel-macos-arm64
            artifact_profile: macos-arm64-wheel
            maturin_requirement: maturin
            extra_build_args: ""
          - label: Windows x86_64
            runs_on: windows-latest
            artifact_name: wheel-windows-x86_64
            artifact_profile: windows-x86-64-wheel
            maturin_requirement: maturin
            extra_build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv
        with:
          sync-project: "false"

      - name: Resolve release build tool requirements
        id: release-tools
        shell: bash
        run: cargo dev release build-tool-requirements --repo-root . >> "$GITHUB_OUTPUT"

      - name: Build release wheel
        shell: bash
        run: |
          set -euo pipefail

          case '${{ matrix.maturin_requirement }}' in
            maturin)
              maturin_requirement='${{ steps.release-tools.outputs.maturin }}'
              ;;
            maturin_zig)
              maturin_requirement='${{ steps.release-tools.outputs.maturin_zig }}'
              ;;
            *)
              echo "Unknown maturin requirement output '${{ matrix.maturin_requirement }}'"
              exit 1
              ;;
          esac

          extra_build_args=(${{ matrix.extra_build_args }})
          rm -rf dist
          uv run --isolated --with "$maturin_requirement" -- \
            maturin build --release --locked --manifest-path crates/tq-cli/Cargo.toml \
            --bindings bin --out dist -i python "${extra_build_args[@]}"

      - name: Verify wheel
        run: >-
          cargo dev release verify-artifacts
          --dist-dir dist
          --profile '${{ matrix.artifact_profile }}'

      - name: Smoke check built wheel entrypoints
        shell: bash
        run: |
          set -euo pipefail

          wheel_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [ -z "$wheel_path" ]; then
            echo "No wheel artifact found in dist/"
            exit 1
          fi

          uv run --isolated --no-project --with "$wheel_path" -- tq --help
          uv run --isolated --no-project --with "$wheel_path" -- tq check --help

      - name: Upload tag release candidate wheel
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tag-release-candidate-${{ matrix.artifact_name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  tag-release-artifacts:
    name: Tag release artifact attestation
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [automation-policy, commit-messages, hygiene, format, lint, tests, build, release-wheels, security, package-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Reset artifact directory
        run: rm -rf dist

      - name: Download tag release candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tag-release-candidate-*
          merge-multiple: true
          path: dist

      - name: Verify downloaded release artifacts
        run: cargo dev release verify-artifacts --dist-dir dist --profile full-release

      - name: Generate artifact attestations for validated distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*

      - name: Upload validated distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package-compatibility:
    name: Package compatibility (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          sync-project: "false"

      - name: Resolve release build tool requirements
        id: release-tools
        shell: bash
        run: cargo dev release build-tool-requirements --repo-root . >> "$GITHUB_OUTPUT"

      - name: Build Python source distribution
        run: |
          rm -rf dist
          uv build --sdist

      - name: Build publishable Linux wheel
        run: >-
          uv run --isolated --with "${{ steps.release-tools.outputs.maturin_zig }}" --
          maturin build --release --locked --manifest-path crates/tq-cli/Cargo.toml
          --bindings bin --out dist -i python --compatibility pypi --zig

      - name: Verify built release artifacts
        run: cargo dev release verify-artifacts --dist-dir dist --profile linux-pair

      - name: Smoke check built package entrypoints
        shell: bash
        run: |
          set -euo pipefail

          wheel_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.whl' | head -n 1)"
          if [ -z "$wheel_path" ]; then
            echo "No wheel artifact found in dist/"
            exit 1
          fi

          sdist_path="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          if [ -z "$sdist_path" ]; then
            echo "No source distribution artifact found in dist/"
            exit 1
          fi

          uv run --isolated --no-project --with "$wheel_path" -- tq --help
          uv run --isolated --no-project --with "$wheel_path" -- tq check --help
          uv run --isolated --no-project --with "$sdist_path" -- tq --help
          uv run --isolated --no-project --with "$sdist_path" -- tq check --help

  security:
    name: Security checks
    needs: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust toolchain
        if: ${{ needs.change-scope.outputs.rust_security == 'true' }}
        uses: ./.github/actions/setup-rust

      - name: Setup Python + uv + deps
        uses: ./.github/actions/setup-python-uv

      - name: Setup Rust security tools
        if: ${{ needs.change-scope.outputs.rust_security == 'true' }}
        uses: ./.github/actions/setup-rust-security-tools

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Detect secrets (baseline)
        run: uv run detect-secrets-hook --baseline .detect-secrets.baseline

      - name: Cargo audit
        if: ${{ needs.change-scope.outputs.rust_security == 'true' }}
        run: cargo audit

      - name: Cargo deny
        if: ${{ needs.change-scope.outputs.rust_security == 'true' }}
        run: cargo deny check

      - name: Setup docs toolchain
        if: ${{ needs.change-scope.outputs.docs_security == 'true' }}
        uses: ./.github/actions/setup-docs
        with:
          install-dependencies: "false"

      - name: npm audit (docs toolchain)
        if: ${{ needs.change-scope.outputs.docs_security == 'true' }}
        run: npm audit --package-lock-only

      - name: Summarize gated dependency scans
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Dependency security scope"
            echo
            echo "- Rust dependency security scans: ${{ needs.change-scope.outputs.rust_security }}"
            echo "- Docs dependency security scans: ${{ needs.change-scope.outputs.docs_security }}"
            echo "- Docs sync contracts: ${{ needs.change-scope.outputs.docs_sync }}"
            echo "- Docs site build: ${{ needs.change-scope.outputs.docs_build }}"
            echo
            echo "Secret scanning remains unconditional in main CI."
          } >> "$GITHUB_STEP_SUMMARY"

  automation-policy:
    name: Automation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: Verify fail-closed automation policy
        run: cargo dev policy verify-automation --repo-root .
